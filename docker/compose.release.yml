# Standalone published-image deployment; no source checkout or Rust toolchain required.
# Run as a non-root host user. Create config/ and downloads/ and set MDM_UID/MDM_GID
# to their owner. See README.md for first-run security and owner enrollment.
services:
  webmister:
    image: "${MDM_IMAGE:-ghcr.io/mohamedyassine-benmiled/webmisterdownloadmanager:latest}"
    restart: unless-stopped
    init: true
    user: "${MDM_UID:-1000}:${MDM_GID:-1000}"
    stop_grace_period: 60s
    ports:
      - "${MDM_BIND_ADDRESS:-127.0.0.1}:${MDM_WEB_PORT:-8463}:8463"
    environment:
      MDM_DATA_DIR: /config
      MDM_DOWNLOADS: /downloads
      MDM_REMOTE_PORT: "8463"
      MDM_REMOTE_URL: "${MDM_REMOTE_URL:-http://localhost:8463/}"
      MDM_REMOTE_TLS: "${MDM_REMOTE_TLS:-0}"
      MDM_REMOTE_HOSTS: "${MDM_REMOTE_HOSTS:-localhost}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
