# Mister Download Manager on a server (#157): docs/server.md.
#   cp docker/.env.example docker/.env
#   mkdir -p docker/config docker/downloads  # as the configured MDM_UID:MDM_GID
#   docker compose --env-file docker/.env -f docker/compose.yml up -d --build
#   docker compose -f docker/compose.yml logs mdm         # the address and a pairing code
#   docker compose -f docker/compose.yml exec mdm misterdownloadmanager-cli pair
services:
  mdm:
    image: "${MDM_IMAGE:-misterdownloadmanager-web:local}"
    build:
      context: ..
      args:
        PROFILE: "${MDM_BUILD_PROFILE:-release}"
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    # The user that owns your downloads folder (`id -u`:`id -g`; 99:100 on Unraid).
    user: "${MDM_UID:-1000}:${MDM_GID:-1000}"
    ports:
      # Loopback by default. Set a specific LAN/VPN address to reach it from another device.
      - "${MDM_BIND_ADDRESS:-127.0.0.1}:${MDM_WEB_PORT:-8463}:8463"
    environment:
      # The address you open the page with (the server's, with the port above).
      MDM_REMOTE_URL: "${MDM_REMOTE_URL:-https://localhost:8463/}"
      # Names besides the server's address you open the page with (comma-separated).
      MDM_REMOTE_HOSTS: "${MDM_REMOTE_HOSTS:-localhost}"
      MDM_DATA_DIR: /config
      MDM_DOWNLOADS: /downloads
      MDM_REMOTE_PORT: "8463"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - "${MDM_CONFIG_DIR:-./config}:/config"
      # Where downloads land: a folder of the server, or a network share mounted on it.
      - "${MDM_DOWNLOADS_DIR:-./downloads}:/downloads"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
