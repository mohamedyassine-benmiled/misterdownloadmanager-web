# Fork-only image publication. Do not add Docker jobs to upstream's desktop release workflow.
name: Webmister image

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR (main or a web-v* tag only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    outputs:
      published:
        value: ${{ jobs.image.outputs.published }}

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  # Never cancel a publication halfway through its set of tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/web.yml

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.image.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native and remote extension compatibility
        run: node tools/extension/test.mjs
      - name: Image publication policy tests
        run: python3 -m unittest discover -s tools/docker -p 'test_*.py'
      - name: Image names and publication policy
        id: image
        env:
          MDM_PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: python3 tools/docker/release.py
      - uses: docker/setup-buildx-action@v3
      - name: Build locally before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha,scope=web-image-amd64
          cache-to: type=gha,mode=max,scope=web-image-amd64
      - name: Isolated runtime smoke gate
        env:
          IMAGE: ${{ steps.image.outputs.test_tag }}
        run: bash tools/docker/smoke.sh "$IMAGE"
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image and record registry digests
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.test_tag }}
        run: |
          while IFS= read -r tag; do docker push "$tag"; done < target/docker-release/image-tags.txt
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > target/docker-release/image-digests.json
          python3 tools/docker/release.py --record-digests target/docker-release/image-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-image-release
          path: target/docker-release/*
          if-no-files-found: error
